[project]
name = "algoritmo-fisico"
version = "1.0.0"
description = "Processa imagens de pseudocódigos feitos com Algoritmos Físicos"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
]
